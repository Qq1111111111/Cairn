services:
  cairn-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: cairn-app
    container_name: cairn-server
    ports:
      - "8000:8000"
    volumes:
      - ./datas/cairn/:/root/.local/share/cairn/
      - ./worker-project-files:/cairn/worker-project-files
    environment:
      CAIRN_PROJECT_FILES_DIR: /cairn/worker-project-files
      CAIRN_AUTH_USERNAME: ${CAIRN_AUTH_USERNAME:-admin}
      CAIRN_AUTH_PASSWORD: ${CAIRN_AUTH_PASSWORD:-ChangeMe!123456}
      CAIRN_SESSION_SECRET: ${CAIRN_SESSION_SECRET:-please-change-this-session-secret}
      CAIRN_INTERNAL_TOKEN: ${CAIRN_INTERNAL_TOKEN:-please-change-this-internal-token}
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/auth/session', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    command: ["uv", "run", "cairn", "serve", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
  cairn-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: cairn-app
    container_name: cairn-dispatcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dispatch.yaml:/cairn/dispatch.yaml
      - ./worker-project-files:/cairn/worker-project-files
    environment:
      CAIRN_INTERNAL_TOKEN: ${CAIRN_INTERNAL_TOKEN:-please-change-this-internal-token}
    depends_on:
      cairn-server:
        condition: service_healthy
    restart: unless-stopped
    command: ["uv", "run", "cairn", "dispatch", "--config", "dispatch.yaml"]
