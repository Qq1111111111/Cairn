server: "http://cairn-server:38080"

WEB_USERNAME: "admin"
WEB_PASSWORD: "change-me"

DINGTALK_ENABLED: false
DINGTALK_WEBHOOK: ""
DINGTALK_SECRET: ""

common_env:
  TSEC_SERVER_HOST: "<SERVER_HOST>:38080"
  TSEC_AGENT_TOKEN: "change-me"

runtime:
  interval: 3
  max_workers: 9
  max_running_projects: 3
  max_project_workers: 3
  healthcheck_timeout: 20
  prompt_group: "default"

tasks:
  bootstrap:
    timeout: 300
    conclude_timeout: 90
  reason:
    timeout: 300
    max_intents: 2
  explore:
    timeout: 300
    conclude_timeout: 90

container:
  image: "ghcr.io/oritera/cairn-worker-container:latest"
  network_mode: "host"
  completed_action: "stop"
  # cap_add:
  #   - "NET_RAW"
  #   - "NET_ADMIN"


